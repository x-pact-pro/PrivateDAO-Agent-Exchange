name: Deploy Agent Exchange

on:
  workflow_run:
    workflows: ["Agent Exchange"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      production_approval:
        description: "Type I_APPROVE_PRODUCTION_DEPLOY to authorize the production deployment"
        required: true
        type: string

concurrency:
  group: agent-exchange-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

env:
  SERVICE_DIR: .
  AWS_REGION: ${{ vars.AGENT_EXCHANGE_AWS_REGION }}
  FUNCTION_NAME: ${{ vars.AGENT_EXCHANGE_FUNCTION_NAME }}
  PUBLIC_BASE_URL: ${{ vars.AGENT_EXCHANGE_PUBLIC_BASE_URL }}
  SMOKE_BASE_URL: ${{ vars.AGENT_EXCHANGE_SMOKE_BASE_URL || vars.AGENT_EXCHANGE_PUBLIC_BASE_URL }}

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      deploy_sha: ${{ steps.sha.outputs.deploy_sha }}
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    steps:
      - name: Checkout immutable main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Resolve deployment SHA
        id: sha
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploy candidate: $DEPLOY_SHA"

      - name: Require an explicit standalone deployment target
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo "::error::AGENT_EXCHANGE_AWS_REGION is not configured."; exit 1; }
          test -n "$FUNCTION_NAME" || { echo "::error::AGENT_EXCHANGE_FUNCTION_NAME is not configured."; exit 1; }
          test -n "$PUBLIC_BASE_URL" || { echo "::error::AGENT_EXCHANGE_PUBLIC_BASE_URL is not configured."; exit 1; }
          test -n "$SMOKE_BASE_URL" || { echo "::error::AGENT_EXCHANGE_SMOKE_BASE_URL is not configured."; exit 1; }
          test "$AWS_REGION" = "us-east-1" || {
            echo "::error::Production Agent Exchange deployments are restricted to Virginia (us-east-1)."
            exit 1
          }
          test "$FUNCTION_NAME" = "PrivateDAOAgentExchange-Virginia-Standby" || {
            echo "::error::Production Agent Exchange deployments are restricted to the Virginia Lambda."
            exit 1
          }
          case "$PUBLIC_BASE_URL" in
            https://agent.pdaowallet.com|https://agents.pdaowallet.com|https://agents.privatedao.org) ;;
            *) echo "::error::Public base URL must be a verified Virginia Agent Exchange domain."; exit 1 ;;
          esac

      - name: Require explicit production approval for deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          PRODUCTION_APPROVAL: ${{ inputs.production_approval }}
        run: |
          set -euo pipefail
          test "$PRODUCTION_APPROVAL" = "I_APPROVE_PRODUCTION_DEPLOY" || {
            echo "::error::Exact production approval phrase was not supplied."
            exit 1
          }

      - name: Require successful CI and Agent Exchange checks for the same SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.sha.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          wait_for_workflow() {
            local workflow_name="$1"
            local state="missing"
            local allowed_events='["push"]'

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # A manual deployment may be preceded by manually dispatched
              # verification workflows when a merge provider does not emit a
              # push check for the squashed main revision.
              allowed_events='["push","workflow_dispatch"]'
            fi

            for attempt in $(seq 1 40); do
              runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${DEPLOY_SHA}&per_page=100")"
              state="$(jq -r --arg name "$workflow_name" --argjson allowed_events "$allowed_events" '
                [.workflow_runs[] | select(.name == $name and (.event as $event | $allowed_events | index($event)))]
                | sort_by(.created_at)
                | last
                | if . == null then "missing" else (.status + ":" + (.conclusion // "none")) end
              ' <<< "$runs")"

              echo "$workflow_name: $state"

              case "$state" in
                completed:success)
                  return 0
                  ;;
                completed:*)
                  echo "::error::$workflow_name did not pass for $DEPLOY_SHA ($state)"
                  return 1
                  ;;
              esac

              sleep 15
            done

            echo "::error::Timed out waiting for $workflow_name on $DEPLOY_SHA (last state: $state)"
            return 1
          }

          wait_for_workflow "Agent Exchange"

      - name: Decide whether the production Lambda needs a deployment
        id: changes
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          if [ "$MANUAL" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: deploying the current verified main revision."
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "Successful main CI: automatically deploying the verified main revision."

  deploy:
    name: Deploy production Lambda
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: agent-exchange-production
      url: ${{ vars.AGENT_EXCHANGE_PUBLIC_BASE_URL || 'https://agents.privatedao.org' }}
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.deploy_sha }}
      ROLE_ARN: ${{ vars.AGENT_EXCHANGE_AWS_ROLE_ARN }}
    steps:
      - name: Set deployment paths
        run: |
          echo "PACKAGE_PATH=$RUNNER_TEMP/privatedao-agent-exchange.zip" >> "$GITHUB_ENV"
          echo "PREVIOUS_PACKAGE_PATH=$RUNNER_TEMP/privatedao-agent-exchange.previous.zip" >> "$GITHUB_ENV"
          echo "PREVIOUS_ENVIRONMENT_PATH=$RUNNER_TEMP/privatedao-agent-exchange.environment.previous.json" >> "$GITHUB_ENV"
          echo "PREVIOUS_INTEGRATIONS_PATH=$RUNNER_TEMP/privatedao-agent-exchange.integrations.previous.json" >> "$GITHUB_ENV"
          echo "PREVIOUS_CORS_PATH=$RUNNER_TEMP/privatedao-agent-exchange.cors.previous.json" >> "$GITHUB_ENV"
          echo "PREVIOUS_SCHEDULE_PATH=$RUNNER_TEMP/privatedao-agent-exchange.schedule.previous.json" >> "$GITHUB_ENV"
          echo "PREVIOUS_SCHEDULE_TARGETS_PATH=$RUNNER_TEMP/privatedao-agent-exchange.schedule-targets.previous.json" >> "$GITHUB_ENV"
          echo "PREVIOUS_SCHEDULE_EXISTS_PATH=$RUNNER_TEMP/privatedao-agent-exchange.schedule-exists.previous" >> "$GITHUB_ENV"
          echo "PREVIOUS_LAMBDA_POLICY_SIDS_PATH=$RUNNER_TEMP/privatedao-agent-exchange.lambda-policy-sids.previous.json" >> "$GITHUB_ENV"
          echo "API_ID_PATH=$RUNNER_TEMP/privatedao-agent-exchange.api-id" >> "$GITHUB_ENV"

      - name: Checkout gated revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.deploy_sha }}

      - name: Resolve supported Lambda runtime
        run: |
          set -euo pipefail
          NODE_VERSION="$(tr -d '[:space:]v' < .nvmrc)"
          [[ "$NODE_VERSION" == "24.10.0" ]] || {
            echo "::error::.nvmrc must pin Node.js 24.10.0 exactly."
            exit 1
          }
          echo "LAMBDA_RUNTIME=nodejs${NODE_VERSION%%.*}.x" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Rebuild and verify deployment artifact
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run provider:gate -- --surface lambda
          npm run lint
          npm test
          npm run smoke
          npm run package -- "$PACKAGE_PATH"
          unzip -tq "$PACKAGE_PATH"

      - name: Require GitHub OIDC deployment role
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Repository variable AGENT_EXCHANGE_AWS_ROLE_ARN is not configured."
            echo "::error::Use a GitHub OIDC IAM role; do not add AWS access keys as repository secrets."
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: privatedao-agent-exchange-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify AWS identity and Lambda target
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          runtime="$(aws lambda get-function-configuration             --function-name "$FUNCTION_NAME"             --query 'Runtime'             --output text)"
          case "$runtime" in
            nodejs24.x) ;;
            *)
              echo "::error::Expected Lambda runtime nodejs24.x, found $runtime."
              exit 1
              ;;
          esac
          echo "Target function: $FUNCTION_NAME"
          echo "Region: $AWS_REGION"
          echo "Current runtime: $runtime"
          echo "Target runtime: $LAMBDA_RUNTIME"
          DOMAIN="${PUBLIC_BASE_URL#https://}"
          DOMAIN="${DOMAIN%%/*}"
          API_ID="$(aws apigatewayv2 get-api-mappings --domain-name "$DOMAIN" --region "$AWS_REGION" --query 'Items[0].ApiId' --output text)"
          test -n "$API_ID" && test "$API_ID" != "None"
          API_NAME="$(aws apigatewayv2 get-api --api-id "$API_ID" --region "$AWS_REGION" --query 'Name' --output text)"
          test "$API_NAME" = "PrivateDAO-AgentExchange-Virginia-Standby" || {
            echo "::error::The configured public domain does not route to the verified Virginia API."
            exit 1
          }

      - name: Capture exact production rollback package
        id: capture
        run: |
          set -euo pipefail

          config="$(aws lambda get-function-configuration             --function-name "$FUNCTION_NAME"             --output json)"

          PREVIOUS_REVISION="$(jq -r '.RevisionId' <<< "$config")"
          PREVIOUS_CODE_SHA="$(jq -r '.CodeSha256' <<< "$config")"
          PREVIOUS_LAST_MODIFIED="$(jq -r '.LastModified' <<< "$config")"
          PREVIOUS_RUNTIME="$(jq -r '.Runtime' <<< "$config")"
          jq -c '.Environment // {Variables:{}}' <<< "$config" > "$PREVIOUS_ENVIRONMENT_PATH"

          DOMAIN="${PUBLIC_BASE_URL#https://}"
          DOMAIN="${DOMAIN%%/*}"
          API_ID="$(aws apigatewayv2 get-api-mappings --domain-name "$DOMAIN" --region "$AWS_REGION" --query 'Items[0].ApiId' --output text)"
          test -n "$API_ID" && test "$API_ID" != "None"
          printf '%s\n' "$API_ID" > "$API_ID_PATH"
          aws apigatewayv2 get-integrations --api-id "$API_ID" --region "$AWS_REGION" --output json > "$PREVIOUS_INTEGRATIONS_PATH"
          jq -e '.Items | type == "array" and length > 0 and all(.[]; .IntegrationId != null and .IntegrationUri != null and .PayloadFormatVersion != null and .TimeoutInMillis != null)' "$PREVIOUS_INTEGRATIONS_PATH" >/dev/null
          aws apigatewayv2 get-api --api-id "$API_ID" --region "$AWS_REGION" --output json | jq -c '.CorsConfiguration // {}' > "$PREVIOUS_CORS_PATH"

          RULE_NAME="PrivateDAOAgentExchangeSettlementSchedule"
          if aws events describe-rule --name "$RULE_NAME" --region "$AWS_REGION" --output json > "$PREVIOUS_SCHEDULE_PATH" 2>/dev/null; then
            echo "true" > "$PREVIOUS_SCHEDULE_EXISTS_PATH"
            jq 'with_entries(select(.key | IN("Name", "ScheduleExpression", "ScheduleExpressionTimezone", "EventPattern", "State", "Description", "RoleArn", "EventBusName")))' \
              "$PREVIOUS_SCHEDULE_PATH" > "$PREVIOUS_SCHEDULE_PATH.tmp"
            mv "$PREVIOUS_SCHEDULE_PATH.tmp" "$PREVIOUS_SCHEDULE_PATH"
            aws events list-targets-by-rule --rule "$RULE_NAME" --region "$AWS_REGION" --output json \
              | jq '.Targets // []' > "$PREVIOUS_SCHEDULE_TARGETS_PATH"
          else
            echo "false" > "$PREVIOUS_SCHEDULE_EXISTS_PATH"
            printf '[]\n' > "$PREVIOUS_SCHEDULE_TARGETS_PATH"
            printf '{}\n' > "$PREVIOUS_SCHEDULE_PATH"
          fi

          aws lambda get-policy --function-name "$FUNCTION_NAME" --region "$AWS_REGION" --output json \
            | jq -r '.Policy' | jq '[.Statement[]?.Sid]' > "$PREVIOUS_LAMBDA_POLICY_SIDS_PATH"

          code_url="$(aws lambda get-function             --function-name "$FUNCTION_NAME"             --query 'Code.Location'             --output text)"

          curl --fail --silent --show-error --location "$code_url"             --output "$PREVIOUS_PACKAGE_PATH"

          unzip -tq "$PREVIOUS_PACKAGE_PATH"

          echo "PREVIOUS_REVISION=$PREVIOUS_REVISION" >> "$GITHUB_ENV"
          echo "PREVIOUS_CODE_SHA=$PREVIOUS_CODE_SHA" >> "$GITHUB_ENV"
          echo "PREVIOUS_LAST_MODIFIED=$PREVIOUS_LAST_MODIFIED" >> "$GITHUB_ENV"
          echo "PREVIOUS_RUNTIME=$PREVIOUS_RUNTIME" >> "$GITHUB_ENV"

          {
            echo "### Rollback snapshot"
            echo "- Function: $FUNCTION_NAME"
            echo "- Previous CodeSha256: $PREVIOUS_CODE_SHA"
            echo "- Previous LastModified: $PREVIOUS_LAST_MODIFIED"
            echo "- Previous runtime: $PREVIOUS_RUNTIME"
            echo "- API Gateway integrations, CORS, Lambda environment and EventBridge settlement schedule captured for rollback without publishing values"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy verified package and publish immutable version
        id: deploy_code
        continue-on-error: true
        run: |
          set -euo pipefail

          LOCAL_CODE_SHA="$(openssl dgst -sha256 -binary "$PACKAGE_PATH" | base64 | tr -d '\n')"

          aws lambda update-function-code             --function-name "$FUNCTION_NAME"             --zip-file "fileb://$PACKAGE_PATH"             --revision-id "$PREVIOUS_REVISION"             >/tmp/agent-exchange-update.json

          aws lambda wait function-updated-v2             --function-name "$FUNCTION_NAME"

          deployed="$(aws lambda get-function-configuration             --function-name "$FUNCTION_NAME"             --output json)"

          DEPLOYED_CODE_SHA="$(jq -r '.CodeSha256' <<< "$deployed")"
          CODE_REVISION="$(jq -r '.RevisionId' <<< "$deployed")"

          if [ "$DEPLOYED_CODE_SHA" != "$LOCAL_CODE_SHA" ]; then
            echo "::error::AWS CodeSha256 does not match the locally verified package."
            exit 1
          fi

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --runtime "$LAMBDA_RUNTIME" \
            --revision-id "$CODE_REVISION" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"

          deployed="$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" --output json)"
          DEPLOYED_RUNTIME="$(jq -r '.Runtime' <<< "$deployed")"
          DEPLOYED_REVISION="$(jq -r '.RevisionId' <<< "$deployed")"
          if [ "$DEPLOYED_RUNTIME" != "$LAMBDA_RUNTIME" ]; then
            echo "::error::Lambda runtime $DEPLOYED_RUNTIME does not match target $LAMBDA_RUNTIME."
            exit 1
          fi

          environment="$(jq -c '.Environment.Variables + {AGENT_EXCHANGE_PAYOUT_SECRET_ID: "pdao/agent-exchange/payout-signer", AGENT_EXCHANGE_PAYOUT_BATCH_LIMIT: "20"} | {Variables: .}' <<< "$deployed")"
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --runtime "$LAMBDA_RUNTIME" \
            --environment "$environment" \
            --revision-id "$DEPLOYED_REVISION" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          deployed="$(aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --output json)"
          DEPLOYED_RUNTIME="$(jq -r '.Runtime' <<< "$deployed")"
          DEPLOYED_REVISION="$(jq -r '.RevisionId' <<< "$deployed")"
          if [ "$(jq -r '.CodeSha256' <<< "$deployed")" != "$LOCAL_CODE_SHA" ] || [ "$DEPLOYED_RUNTIME" != "$LAMBDA_RUNTIME" ]; then
            echo "::error::Lambda code or runtime changed while reconciling production configuration."
            exit 1
          fi
          jq -e '.Environment.Variables.AGENT_EXCHANGE_PAYOUT_SECRET_ID == "pdao/agent-exchange/payout-signer" and .Environment.Variables.AGENT_EXCHANGE_PAYOUT_BATCH_LIMIT == "20"' <<< "$deployed" >/dev/null

          VERSION="$(aws lambda publish-version             --function-name "$FUNCTION_NAME"             --description "github:$DEPLOY_SHA"             --query 'Version'             --output text)"

          echo "DEPLOYED_REVISION=$DEPLOYED_REVISION" >> "$GITHUB_ENV"
          echo "DEPLOYED_CODE_SHA=$DEPLOYED_CODE_SHA" >> "$GITHUB_ENV"
          echo "DEPLOYED_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DEPLOYED_RUNTIME=$DEPLOYED_RUNTIME" >> "$GITHUB_ENV"

          {
            echo "### Deployment"
            echo "- Commit: $DEPLOY_SHA"
            echo "- CodeSha256: $DEPLOYED_CODE_SHA"
            echo "- Lambda runtime: $DEPLOYED_RUNTIME"
            echo "- Published rollback/reference version: $VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Route API Gateway to current Lambda
        id: route_api
        if: steps.deploy_code.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail

          DOMAIN="${PUBLIC_BASE_URL#https://}"
          DOMAIN="${DOMAIN%%/*}"
          API_ID="$(aws apigatewayv2 get-api-mappings \
            --domain-name "$DOMAIN" \
            --region "$AWS_REGION" \
            --query 'Items[0].ApiId' \
            --output text)"
          test -n "$API_ID" && test "$API_ID" != "None"

          BASE_FUNCTION_ARN="$(aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query 'Configuration.FunctionArn' \
            --output text)"
          test -n "$BASE_FUNCTION_ARN" && test "$BASE_FUNCTION_ARN" != "None"
          FUNCTION_ARN="${BASE_FUNCTION_ARN}:${DEPLOYED_VERSION}"
          INTEGRATION_URI="arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/${FUNCTION_ARN}/invocations"

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          API_SOURCE_ARN="arn:aws:execute-api:${AWS_REGION}:${ACCOUNT_ID}:${API_ID}/*/*/*"
          UNQUALIFIED_STATEMENT_ID="agent-exchange-api-unqualified-rollback"
          if ! PERMISSION_ERROR="$(aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id "$UNQUALIFIED_STATEMENT_ID" \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "$API_SOURCE_ARN" 2>&1)"; then
            if ! printf '%s\n' "$PERMISSION_ERROR" | grep -q 'ResourceConflictException'; then
              printf '%s\n' "$PERMISSION_ERROR" >&2
              exit 1
            fi
          fi

          STATEMENT_ID="agent-exchange-api-${DEPLOYED_VERSION}"
          if ! PERMISSION_ERROR="$(aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$DEPLOYED_VERSION" \
            --statement-id "$STATEMENT_ID" \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "$API_SOURCE_ARN" 2>&1)"; then
            if ! printf '%s\n' "$PERMISSION_ERROR" | grep -q 'ResourceConflictException'; then
              printf '%s\n' "$PERMISSION_ERROR" >&2
              exit 1
            fi
          fi

          for INTEGRATION_ID in $(aws apigatewayv2 get-integrations \
            --api-id "$API_ID" \
            --region "$AWS_REGION" \
            --query 'Items[].IntegrationId' \
            --output text); do
            aws apigatewayv2 update-integration \
              --api-id "$API_ID" \
              --integration-id "$INTEGRATION_ID" \
              --region "$AWS_REGION" \
              --integration-uri "$INTEGRATION_URI" \
              --payload-format-version 2.0 \
              --timeout-in-millis 30000 >/dev/null
          done

          echo "API Gateway $API_ID routed to immutable Lambda version $DEPLOYED_VERSION"

      - name: Reconcile API Gateway CORS for browser checkout
        id: cors
        if: steps.deploy_code.outcome == 'success' && steps.route_api.outcome == 'success'
        run: |
          set -euo pipefail

          DOMAIN="${PUBLIC_BASE_URL#https://}"
          DOMAIN="${DOMAIN%%/*}"
          API_ID="$(aws apigatewayv2 get-api-mappings \
            --domain-name "$DOMAIN" \
            --region "$AWS_REGION" \
            --query 'Items[0].ApiId' \
            --output text)"
          test -n "$API_ID" && test "$API_ID" != "None"

          cors_configuration="$(jq -cn '{
            AllowCredentials: false,
            AllowHeaders: [
              "content-type",
              "authorization",
              "cookie",
              "x-pdao-owner-token",
              "mcp-protocol-version",
              "mcp-session-id",
              "payment-signature",
              "x-github-event",
              "x-hub-signature-256"
            ],
            AllowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
            AllowOrigins: ["*"],
            ExposeHeaders: ["payment-required", "payment-response"],
            MaxAge: 300
          }')"

          aws apigatewayv2 update-api \
            --api-id "$API_ID" \
            --region "$AWS_REGION" \
            --cors-configuration "$cors_configuration" >/dev/null

          echo "API Gateway CORS reconciled for browser x402 checkout: $API_ID"

      - name: Production smoke gate
        id: smoke
        if: >-
          steps.deploy_code.outcome == 'success' &&
          steps.route_api.outcome == 'success' &&
          steps.cors.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail

          retry_json() {
            local url="$1"
            local output="$2"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error                 --connect-timeout 10 --max-time 30                 "$url" -o "$output" &&
                jq -e 'type == "object"' "$output" >/dev/null; then
                return 0
              fi
              sleep 10
            done
            return 1
          }

          retry_json "$SMOKE_BASE_URL/api/health" /tmp/health.json
          retry_json "$SMOKE_BASE_URL/api/services" /tmp/services.json
          retry_json "$SMOKE_BASE_URL/.well-known/agent-card.json" /tmp/agent-card.json
          retry_json "$SMOKE_BASE_URL/openapi.json" /tmp/openapi.json
          retry_json "$SMOKE_BASE_URL/api/providers/status" /tmp/providers.json
          retry_json "$SMOKE_BASE_URL/api/marketplace/policy" /tmp/marketplace-policy.json
          retry_json "$SMOKE_BASE_URL/api/privatepay/status" /tmp/privatepay-status.json

          jq -e '.services | type == "array" and length >= 24' /tmp/services.json >/dev/null
          jq -e '[.services[].id] | index("verify.basic") != null' /tmp/services.json >/dev/null
          jq -e '.openapi != null and .paths != null' /tmp/openapi.json >/dev/null
          jq -e '[.providers[] | select(.provider == "mongodb" and .role == "visitor-accounts-favorites-cart" and .status == "configured")] | length == 1' /tmp/providers.json >/dev/null
          jq -e '.seller_tiers.free.listing_fee_usd == 0 and (.seller_tiers | has("basic") and has("pro"))' /tmp/marketplace-policy.json >/dev/null
          jq -e '.enabled == true and .operational == true and (.activation_blockers | length == 0) and .payment_link_buyer_checkout.funded_execution == "enabled"' /tmp/privatepay-status.json >/dev/null

          preflight_headers="$(curl --fail --silent --show-error --dump-header - --output /dev/null \
            -X OPTIONS "$SMOKE_BASE_URL/api/privatepay/x402/requirements" \
            -H 'Origin: https://privatedao.org' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,payment-signature')"
          grep -Eiq '^access-control-allow-origin:[[:space:]]*\*' <<< "$preflight_headers"
          grep -Eiq '^access-control-allow-methods:.*POST' <<< "$preflight_headers"
          grep -Eiq '^access-control-allow-headers:.*payment-signature' <<< "$preflight_headers"

          privatepay_status="$(curl -q --silent --show-error --dump-header /tmp/privatepay-headers \
            --output /tmp/privatepay-response --write-out '%{http_code}' \
            -X POST "$SMOKE_BASE_URL/api/privatepay/x402/requirements" \
            -H 'Origin: https://privatedao.org' \
            -H 'Content-Type: application/json' \
            --data '{"resource":"https://agents.privatedao.org/services/privatepay-x402","provider_id":"privatepay.x402","amount_base_units":"500000"}')"
          test "$privatepay_status" = "200"
          jq -e '.requirements.x402Version == 2 and .requirements.accepts[0].scheme == "exact-magicblock" and .requirements.accepts[0].network == "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp" and .requirements.accepts[0].asset == "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v" and .requirements.accepts[0].amount == "500000" and .pdao.required == false' /tmp/privatepay-response >/dev/null
          grep -Eiq '^access-control-expose-headers:.*payment-required' /tmp/privatepay-headers

          echo "Production smoke gate passed, including MongoDB accounts, seller-tier policy, operational PrivatePAY checkout status, canonical x402 requirements, and browser CORS."

      - name: Verify live Agent Exchange contract
        id: live_surface
        if: steps.deploy_code.outcome == 'success' && steps.route_api.outcome == 'success'
        continue-on-error: true
        env:
          AGENT_EXCHANGE_PUBLIC_BASE_URL: ${{ env.SMOKE_BASE_URL }}
        run: |
          set -euo pipefail
          npm run verify:live-surface

      - name: Reconcile scheduled seller settlement trigger
        id: settlement_schedule
        if: steps.deploy_code.outcome == 'success' && steps.route_api.outcome == 'success' && steps.cors.outcome == 'success' && steps.smoke.outcome == 'success' && steps.live_surface.outcome == 'success'
        run: |
          set -euo pipefail

          RULE_NAME="PrivateDAOAgentExchangeSettlementSchedule"
          STATEMENT_ID="agent-exchange-settlement-schedule"
          FUNCTION_ARN="$(aws lambda get-function --function-name "$FUNCTION_NAME" --query 'Configuration.FunctionArn' --output text)"
          RULE_ARN="$(aws events put-rule --name "$RULE_NAME" --schedule-expression 'rate(5 minutes)' --state ENABLED --description 'PrivateDAO Agent Exchange seller settlement sweep' --query 'RuleArn' --output text)"

          aws events put-targets --rule "$RULE_NAME" --targets "Id=agent-exchange-settlement,Arn=$FUNCTION_ARN" >/dev/null

          if ! PERMISSION_ERROR="$(aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id "$STATEMENT_ID" \
            --action lambda:InvokeFunction \
            --principal events.amazonaws.com \
            --source-arn "$RULE_ARN" 2>&1)"; then
            if ! printf '%s\n' "$PERMISSION_ERROR" | grep -q 'ResourceConflictException'; then
              printf '%s\n' "$PERMISSION_ERROR" >&2
              exit 1
            fi
          fi

          echo "Settlement schedule reconciled: $RULE_NAME"

      - name: Roll back automatically on deployment or smoke failure
        id: rollback
        if: >-
          always() &&
          steps.capture.outcome == 'success' &&
          (
            steps.deploy_code.outcome == 'failure' ||
            steps.route_api.outcome == 'failure' ||
            steps.cors.outcome == 'failure' ||
            steps.smoke.outcome == 'failure' ||
            steps.live_surface.outcome == 'failure' ||
            steps.settlement_schedule.outcome == 'failure'
          )
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "::warning::Deployment gate failed; restoring the exact pre-deploy Lambda package."

          CURRENT_REVISION="$(aws lambda get-function-configuration             --function-name "$FUNCTION_NAME"             --query 'RevisionId'             --output text)"

          aws lambda update-function-code             --function-name "$FUNCTION_NAME"             --zip-file "fileb://$PREVIOUS_PACKAGE_PATH"             --revision-id "$CURRENT_REVISION"             >/tmp/agent-exchange-rollback.json

          aws lambda wait function-updated-v2             --function-name "$FUNCTION_NAME"

          RESTORED_CODE_SHA="$(aws lambda get-function-configuration             --function-name "$FUNCTION_NAME"             --query 'CodeSha256'             --output text)"

          if [ "$RESTORED_CODE_SHA" != "$PREVIOUS_CODE_SHA" ]; then
            echo "::error::Rollback CodeSha256 mismatch."
            exit 1
          fi

          RESTORED_REVISION="$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'RevisionId' \
            --output text)"
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --runtime "$PREVIOUS_RUNTIME" \
            --environment "file://$PREVIOUS_ENVIRONMENT_PATH" \
            --revision-id "$RESTORED_REVISION" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          RESTORED_RUNTIME="$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Runtime' \
            --output text)"
          if [ "$RESTORED_RUNTIME" != "$PREVIOUS_RUNTIME" ]; then
            echo "::error::Rollback runtime mismatch."
            exit 1
          fi

          API_ID="$(cat "$API_ID_PATH")"
          test -n "$API_ID" && test "$API_ID" != "None"
          while IFS=$'\t' read -r integration_id integration_uri payload_format timeout_ms; do
            test -n "$integration_id" || continue
            aws apigatewayv2 update-integration \
              --api-id "$API_ID" \
              --integration-id "$integration_id" \
              --region "$AWS_REGION" \
              --integration-uri "$integration_uri" \
              --payload-format-version "$payload_format" \
              --timeout-in-millis "$timeout_ms" >/dev/null
          done < <(jq -r '.Items[] | [.IntegrationId, .IntegrationUri, .PayloadFormatVersion, .TimeoutInMillis] | @tsv' "$PREVIOUS_INTEGRATIONS_PATH")
          aws apigatewayv2 update-api \
            --api-id "$API_ID" \
            --region "$AWS_REGION" \
            --cors-configuration "file://$PREVIOUS_CORS_PATH" >/dev/null
          echo "API Gateway routing and CORS restored to their captured pre-deploy settings."

          RULE_NAME="PrivateDAOAgentExchangeSettlementSchedule"
          if [ "$(cat "$PREVIOUS_SCHEDULE_EXISTS_PATH")" = "true" ]; then
            jq '.State = "DISABLED"' "$PREVIOUS_SCHEDULE_PATH" > "$RUNNER_TEMP/agent-exchange-schedule-disabled.json"
            aws events put-rule --region "$AWS_REGION" \
              --cli-input-json "file://$RUNNER_TEMP/agent-exchange-schedule-disabled.json" >/dev/null
          fi

          mapfile -t CURRENT_TARGET_IDS < <(aws events list-targets-by-rule \
            --rule "$RULE_NAME" --region "$AWS_REGION" --query 'Targets[].Id' --output text | tr '\t' '\n')
          if [ "${#CURRENT_TARGET_IDS[@]}" -gt 0 ] && [ -n "${CURRENT_TARGET_IDS[0]}" ]; then
            aws events remove-targets --rule "$RULE_NAME" --region "$AWS_REGION" \
              --ids "${CURRENT_TARGET_IDS[@]}" >/dev/null
          fi

          if [ "$(cat "$PREVIOUS_SCHEDULE_EXISTS_PATH")" = "true" ]; then
            if [ "$(jq 'length' "$PREVIOUS_SCHEDULE_TARGETS_PATH")" -gt 0 ]; then
              jq -n --arg rule "$RULE_NAME" --slurpfile targets "$PREVIOUS_SCHEDULE_TARGETS_PATH" \
                '{Rule:$rule,Targets:$targets[0]}' > "$RUNNER_TEMP/agent-exchange-schedule-targets-restore.json"
              target_restore="$(aws events put-targets --region "$AWS_REGION" \
                --cli-input-json "file://$RUNNER_TEMP/agent-exchange-schedule-targets-restore.json")"
              jq -e '.FailedEntryCount == 0' <<< "$target_restore" >/dev/null
            fi
            aws events put-rule --region "$AWS_REGION" \
              --cli-input-json "file://$PREVIOUS_SCHEDULE_PATH" >/dev/null
          elif aws events describe-rule --name "$RULE_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws events delete-rule --name "$RULE_NAME" --region "$AWS_REGION" >/dev/null
          fi
          echo "EventBridge settlement rule and targets restored to their captured pre-deploy state."

          PREVIOUS_POLICY_SIDS="$(cat "$PREVIOUS_LAMBDA_POLICY_SIDS_PATH")"
          if ! jq -e 'index("agent-exchange-api-unqualified-rollback") != null' <<< "$PREVIOUS_POLICY_SIDS" >/dev/null; then
            aws lambda remove-permission --function-name "$FUNCTION_NAME" --region "$AWS_REGION" \
              --statement-id "agent-exchange-api-unqualified-rollback" >/dev/null 2>&1 || true
          fi
          if ! jq -e 'index("agent-exchange-settlement-schedule") != null' <<< "$PREVIOUS_POLICY_SIDS" >/dev/null; then
            aws lambda remove-permission --function-name "$FUNCTION_NAME" --region "$AWS_REGION" \
              --statement-id "agent-exchange-settlement-schedule" >/dev/null 2>&1 || true
          fi
          if [ -n "${DEPLOYED_VERSION:-}" ]; then
            aws lambda remove-permission --function-name "$FUNCTION_NAME" --region "$AWS_REGION" \
              --qualifier "$DEPLOYED_VERSION" \
              --statement-id "agent-exchange-api-${DEPLOYED_VERSION}" >/dev/null 2>&1 || true
          fi

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error               --connect-timeout 10 --max-time 30               "$SMOKE_BASE_URL/api/health" >/tmp/rollback-health.json &&
              jq -e 'type == "object"' /tmp/rollback-health.json >/dev/null; then
              echo "Rollback health check passed."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Rollback completed in Lambda but the public health check did not recover."
              exit 1
            fi
            sleep 10
          done

          {
            echo "### Automatic rollback"
            echo "- Restored CodeSha256: $RESTORED_CODE_SHA"
            echo "- Restored Lambda runtime: $RESTORED_RUNTIME"
            echo "- Restored EventBridge settlement schedule and Lambda invoke permissions."
            echo "- Reason: deployment verification or production smoke gate failed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run after a rolled-back deployment
        if: >-
          always() &&
          (
            steps.deploy_code.outcome == 'failure' ||
            steps.route_api.outcome == 'failure' ||
            steps.cors.outcome == 'failure' ||
            steps.smoke.outcome == 'failure' ||
            steps.live_surface.outcome == 'failure' ||
            steps.settlement_schedule.outcome == 'failure'
          )
        run: |
          if [ "${{ steps.rollback.outcome }}" = "success" ]; then
            echo "::error::Deployment failed the gate and production was rolled back successfully."
          else
            echo "::error::Deployment failed and the automatic rollback also needs operator attention."
          fi
          exit 1

      - name: Record successful production release
        if: >-
          steps.deploy_code.outcome == 'success' &&
          steps.route_api.outcome == 'success' &&
          steps.cors.outcome == 'success' &&
          steps.smoke.outcome == 'success' &&
          steps.live_surface.outcome == 'success' &&
          steps.settlement_schedule.outcome == 'success'
        run: |
          {
            echo "### Production release healthy"
            echo "- URL: $PUBLIC_BASE_URL"
            echo "- Commit: $DEPLOY_SHA"
            echo "- Lambda version: $DEPLOYED_VERSION"
            echo "- Lambda runtime: $DEPLOYED_RUNTIME"
            echo "- CodeSha256: $DEPLOYED_CODE_SHA"
            echo "- Rollback package was captured before deployment and was not needed."
          } >> "$GITHUB_STEP_SUMMARY"
