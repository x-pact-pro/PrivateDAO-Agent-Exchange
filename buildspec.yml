version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci

  build:
    commands:
      - echo "Building PrivateDAO Agent Exchange..."
      - npm run build --if-present

  post_build:
    commands:
      - echo "Packaging Lambda..."
      - zip -r function.zip src/ node_modules/ package.json -x "node_modules/aws-sdk/*"

artifacts:
  files:
    - function.zip
  discard-paths: yes
