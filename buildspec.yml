version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci

  build:
    commands:
      - echo "Building PrivateDAO Agent Exchange..."
      - npm run build --if-present
      - npm test --if-present

  post_build:
    commands:
      - echo "Build complete"
      - zip -r function.zip . -x "*.git*" -x "node_modules/aws-sdk/*"

artifacts:
  files:
    - function.zip
  discard-paths: yes
